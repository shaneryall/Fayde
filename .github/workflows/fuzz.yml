name: Fuzz

# Feeds random and mutated input to the readers of files that may come from other people.
# Nightly for ten minutes per reader; one minute per reader on a pull request that touches a reader.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/fayde-fits/**"
      - "crates/fayde-wcs/**"
      - "crates/fayde-index/**"
      - "crates/fayde-catalog/**"
      - "fuzz/**"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fits_image, wcs_header, pattern_index, source_list, instrument_profile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly
          cargo install --locked cargo-fuzz@0.13.2
      - name: Corpus from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 60 || 600 }}
        run: |
          cd fuzz
          cargo fuzz run -O "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: fuzz/artifacts/
