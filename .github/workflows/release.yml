name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.95"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the workspace version
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-dev
      - name: The version number matches the API changes since the last crates.io release
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          exclude: fayde-py

  binaries:
    name: fayde (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}" --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          echo "FAYDE_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.13"
      - name: Build (Linux, glibc 2.17 or later)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -q "cargo-zigbuild>=0.19,<1"
          cargo zigbuild --release --locked -p fayde-cli --target "${{ matrix.target }}.2.17"
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p fayde-cli --target "${{ matrix.target }}"
      - name: Run it and pack the archive
        run: |
          bin="target/${{ matrix.target }}/release/fayde"; [ -f "$bin" ] || bin="$bin.exe"
          "$bin" --version
          "$bin" --version | grep -F "${GITHUB_REF_NAME#v}"
          name="fayde-${{ matrix.platform }}"
          mkdir -p dist "$name/docs"
          cp "$bin" README.md CHANGELOG.md LICENSE NOTICE THIRD-PARTY-LICENSES.md CITATION.cff "$name/"
          cp docs/*.md "$name/docs/"
          cp -R docs/images "$name/docs/"
          cp -R profiles "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}" --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          echo "FAYDE_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build (Linux, manylinux2014)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -q "maturin[zig]>=1.7,<2"
          cd crates/fayde-py
          maturin build --release --locked --zig --compatibility manylinux2014 --target "${{ matrix.target }}" -o ../../dist
      - name: Build
        if: runner.os != 'Linux'
        run: |
          python -m pip install -q "maturin>=1.7,<2"
          cd crates/fayde-py
          maturin build --release --locked --target "${{ matrix.target }}" -o ../../dist
      - name: Install the wheel and run the Python tests
        run: |
          ls -l dist
          python -m venv .venv-ci
          py=.venv-ci/bin/python; [ -x "$py" ] || py=.venv-ci/Scripts/python.exe
          "$py" -m pip install -q pytest numpy
          "$py" -m pip install -q --no-index --find-links dist fayde
          "$py" -c "import fayde; print(fayde.__version__, fayde.commit); assert fayde.__version__ == '${GITHUB_REF_NAME#v}'"
          "$py" -m pytest -q crates/fayde-py/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Build the source distribution
        run: |
          python -m pip install -q "maturin>=1.7,<2"
          cd crates/fayde-py
          maturin sdist -o ../../dist
          ls -l ../../dist
      - name: Build a wheel from the source distribution and run the Python tests
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -q pytest numpy
          .venv-ci/bin/python -m pip install -q dist/fayde-*.tar.gz
          .venv-ci/bin/python -c "import fayde; print(fayde.__version__); assert fayde.__version__ == '${GITHUB_REF_NAME#v}'"
          .venv-ci/bin/python -m pytest -q crates/fayde-py/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  release:
    needs: [checks, version, semver, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS)
          python3 scripts/check_release.py --notes > notes.md
      - name: Attest that these files were built here, from this tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Fayde $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  install-check:
    name: install (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, uname: Linux x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, uname: Linux aarch64 }
          - { os: macos-latest, platform: macos-arm64, uname: Darwin arm64 }
          - { os: macos-15-intel, platform: macos-x86_64, uname: Darwin x86_64 }
          - { os: windows-latest, platform: windows-x86_64, uname: "" }
    env:
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - name: Install on Linux or macOS, as docs/install.md says
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uname -sm
          test "$(uname -sm)" = "${{ matrix.uname }}"
          platform="${{ matrix.platform }}"
          curl -fLO "$BASE/fayde-$platform.tar.gz"
          curl -fLO "$BASE/SHA256SUMS"
          if [ "$RUNNER_OS" = Linux ]; then
            sha256sum --check --ignore-missing SHA256SUMS
          else
            shasum -a 256 --check --ignore-missing SHA256SUMS
          fi
          tar -xzf "fayde-$platform.tar.gz"
          sudo mkdir -p /usr/local/bin && sudo install -m 755 "fayde-$platform/fayde" /usr/local/bin/fayde
          fayde --version
          fayde --version | grep -F "${GITHUB_REF_NAME#v}"
      - name: Install on Windows, as docs/install.md says
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fLO "$env:BASE/fayde-windows-x86_64.zip"
          curl.exe -fLO "$env:BASE/SHA256SUMS"
          $actual = (Get-FileHash fayde-windows-x86_64.zip -Algorithm SHA256).Hash
          $expected = (Select-String fayde-windows-x86_64.zip SHA256SUMS).Line.Split(' ')[0]
          if ($actual -ne $expected) { Write-Error "checksum mismatch"; exit 1 }
          Expand-Archive fayde-windows-x86_64.zip -DestinationPath .
          $env:Path += ";$PWD\fayde-windows-x86_64"
          $version = fayde --version
          $version
          if (-not $version.Contains($env:GITHUB_REF_NAME.TrimStart('v'))) { exit 1 }
