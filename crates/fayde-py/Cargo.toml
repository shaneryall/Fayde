[package]
name = "fayde-py"
description = "Python bindings for the Fayde plate solver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
fayde-api.workspace = true
fayde-cli.workspace = true
fayde-core.workspace = true
fayde-fits.workspace = true
fayde-solve.workspace = true
fayde-wcs.workspace = true
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
