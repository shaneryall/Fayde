[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fayde"
description = "Verified astrometric plate solving for FITS images"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Shane Ryall" }]
keywords = ["astronomy", "astrometry", "plate solving", "WCS", "FITS", "UCAC4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.scripts]
fayde = "fayde._cli:main"

[project.urls]
Repository = "https://github.com/shaneryall/Fayde"
Changelog = "https://github.com/shaneryall/Fayde/blob/main/CHANGELOG.md"
Issues = "https://github.com/shaneryall/Fayde/issues"

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.maturin]
python-source = "python"
module-name = "fayde._native"
features = ["extension-module"]
