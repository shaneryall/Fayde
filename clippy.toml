    { path = "f64::atan2", reason = "platform-dependent last bit; use fayde_core::Portable::patan2" },
    { path = "f64::exp", reason = "platform-dependent last bit; use fayde_core::Portable::pexp" },
    { path = "f64::exp2", reason = "platform-dependent last bit; use fayde_core::Portable::pexp2" },
