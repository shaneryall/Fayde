[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/shaneryall/Fayde"
authors = ["Shane Ryall"]
keywords = ["astronomy", "astrometry", "plate-solving", "wcs", "fits"]
categories = ["science"]

[workspace.dependencies]
fayde-core = { path = "crates/fayde-core", version = "=0.3.2" }
fayde-wcs = { path = "crates/fayde-wcs", version = "=0.3.2" }
fayde-catalog = { path = "crates/fayde-catalog", version = "=0.3.2" }
fayde-index = { path = "crates/fayde-index", version = "=0.3.2" }
fayde-solve = { path = "crates/fayde-solve", version = "=0.3.2" }
fayde-fits = { path = "crates/fayde-fits", version = "=0.3.2" }
fayde-api = { path = "crates/fayde-api", version = "=0.3.2" }
fayde-detect = { path = "crates/fayde-detect", version = "=0.3.2" }
fayde-cli = { path = "crates/fayde-cli", version = "=0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = { version = "0.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
