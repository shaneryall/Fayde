# Dependency policy, checked by `cargo deny check` in continuous integration.

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory for a crate in Cargo.lock; unmaintained crates warn.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licences compatible with distributing Fayde under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
