site_name: Fayde
site_author: Shane Ryall
site_description: Verified astrometric plate solving for FITS images.
site_url: https://shaneryall.github.io/Fayde/
repo_url: https://github.com/shaneryall/Fayde
repo_name: shaneryall/Fayde
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra:
  version:
    provider: mike

hooks:
  - scripts/docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/fayde-py/python]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - github-callouts

nav:
  - Home: index.md
  - How-to guides:
      - Install Fayde: install.md
      - Choose and connect a star catalog: catalog.md
      - Use the command line: usage.md
      - Use Fayde from Python: python.md
      - Build pattern indexes: index-set.md
  - Reference:
      - Command-line reference: reference/cli.md
      - Python API: reference/python-api.md
      - Source list format: source-list.md
      - Versioning: versioning.md
      - Algorithm sources: references.md
      - Changelog: reference/changelog.md
  - Explanation:
      - Plate solver design: design/plate-solver.md
      - Star detection: design/detection.md
      - Trail and streak detection: design/streak-detection.md
      - Literature review: research/literature-review.md
